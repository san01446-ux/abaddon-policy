ating)||0}</b> ${esc(g.pvp_rank||'')} · 식량 <b>${(Number(g.balance)||0).toLocaleString()}</b></p>`:'<p>아직 생존자 프로필이 없습니다. Discord에서 <code>!가입 생존자</code>를 사용하세요.</p>'}<button class="button secondary" id="logout">로그아웃</button></div></div>`;document.getElementById("logout").onclick=logout}catch(e){localStorage.removeItem("abaddon_session");token="";box.innerHTML='<div class="notice">세션이 만료되었습니다.</div><button class="button primary" id="login">다시 로그인</button>';document.getElementById("login").onclick=login}}load()});</script></body></html>
