vP</button><button class="tab" data-kind="level">LEVEL</button><button class="tab" data-kind="wealth">WEALTH</button></div><div class="api-card" id="leaderboard"><div class="notice">Loading rankings…</div></div></div></main><footer class="site-footer"><div class="container footer-wrap"><div>© 2026 ABADDON · FINAL ECLIPSE</div><div class="footer-links"><a href="privacy.html">PRIVACY</a><a href="terms.html">TERMS</a><a data-koreanbots-link="" href="#">Koreanbots</a><a data-discord-link="" href="#">Discord</a></div></div></footer><script>document.addEventListener("DOMContentLoaded",()=>{const c=window.ABADDON_CONFIG||{},base=(c.apiBaseUrl||c.eventFeedUrl||"").replace(/\/$/,""),box=document.getElementById("leaderboard"),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));async function load(kind){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.kind===kind));if(!base){box.innerHTML='<div class="notice">Set <code>apiBaseUrl</code> in config.js to enable live rankings.</div>';return}try{const r=await fetch(base+"/api/leaderboard?type="+encodeURIComponent(kind));const d=await r.json();if(!r.ok||!d.ok)throw new Error();box.innerHTML=(d.rows||[]).map((x,i)=>`<div class="leader-row"><div class="leader-rank">${i+1}</div><div><b>${esc(x.name)}</b><div class="leader-meta">Lv.${Number(x.level)||1} · ${esc(x.pvp_rank||"")}</div></div><div><b>${kind==="pvp"?(Number(x.pvp_rating)||0):kind==="wealth"?(Number(x.balance)||0).toLocaleString():(Number(x.level)||1)}</b></div></div>`).join("")||'<div class="notice">No ranking data yet.</div>'}catch(e){box.innerHTML='<div class="notice">Could not reach the live API.</div>'}}document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>load(x.dataset.kind));load("pvp")});</script></body></html>
